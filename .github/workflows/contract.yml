name: Contract CI

# CI for the Soroban invoice smart contract (contracts/).
# Runs formatting, lint, tests, and an optimized wasm build on every push/PR.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  build-test:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: No committed test snapshots
        run: |
          tracked="$(git ls-files | grep -E '(^|/)test_snapshots/' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Test snapshots must not be committed (see CONTRIBUTING.md, Test snapshots):"
            echo "$tracked"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build optimized wasm
        run: cargo build --locked --target wasm32v1-none --release

      - name: Report wasm size
        run: |
          wasm="target/wasm32v1-none/release/payloop_invoice.wasm"
          bytes="$(wc -c < "$wasm")"
          budget=131072
          {
            echo "### Wasm size"
            echo ""
            echo "| Artifact | Bytes | Budget |"
            echo "| --- | --- | --- |"
            echo "| \`payloop_invoice.wasm\` | ${bytes} | ${budget} (128 KiB) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "payloop_invoice.wasm: ${bytes} bytes (budget: ${budget} bytes)"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::Wasm size ${bytes} bytes exceeds the documented ${budget}-byte budget."
            exit 1
          fi

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: payloop-invoice-wasm
          path: contracts/target/wasm32v1-none/release/payloop_invoice.wasm
          if-no-files-found: error
