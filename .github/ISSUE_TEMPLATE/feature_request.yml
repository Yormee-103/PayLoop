name: Feature request
description: Suggest an idea or improvement for PayLoop.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome as issues. Please describe the user
        problem you're trying to solve rather than a specific implementation
        — see [CONTRIBUTING.md](../../CONTRIBUTING.md#reporting-bugs).
  - type: textarea
    id: problem
    attributes:
      label: What user problem are you trying to solve?
      description: Who is affected, and what can't they do today?
      placeholder: "As a freelancer I want to… so that…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A short description of the behaviour you'd like.
      placeholder: "Add a… on the… page."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other way to solve the same problem, and why it falls short.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate of this request.
          required: true
